name: Testar Estúdio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estudio-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar editor e arquivos originais
        run: node scripts/check-editor.mjs

      - name: Instalar Playwright Core
        run: npm install --no-save playwright-core@1.56.1
      - name: Servir o estúdio por HTTP
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/estudio-http.log 2>&1 &
      - name: Testar navegador e PNG
        run: node scripts/smoke.mjs

      - name: Testar interface móvel, toque, PNG e offline
        run: node scripts/mobile-smoke.mjs

      - name: Instalar FFmpeg para validação de áudio
        run: if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - name: Testar exportação de vídeo com áudio
        run: node scripts/video-smoke.mjs

      - name: Testar fallback MP4 recusado para WebM com áudio
        run: STUDIO_TEST_CODEC_FALLBACK=1 node scripts/video-smoke.mjs

      - name: Gerar HTML offline único com 22 molduras
        run: node scripts/build-offline.mjs
      - name: Testar HTML offline sem servidor
        run: node scripts/offline-smoke.mjs
      - name: Testar exportação de vídeo com áudio no arquivo offline
        run: STUDIO_URL="file://$GITHUB_WORKSPACE/dist/Estudio_Coroado_Offline.html" node scripts/video-smoke.mjs
      - name: Montar pacote privado PWA + HTML offline para PC e Android
        run: node scripts/package-private.mjs
      - name: Validar pacote instalável em localhost, offline e tela móvel
        run: node scripts/package-smoke.mjs
      - name: Disponibilizar pacote privado de instalação
        uses: actions/upload-artifact@v4
        with:
          name: Estudio-Coroado-Privado-PC-Android
          path: dist/Estudio-Coroado-Privado/
          retention-days: 30
          if-no-files-found: error
