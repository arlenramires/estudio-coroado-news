name: Gerar ícones privados do Estúdio
on:
  push:
    branches: [main]
    paths:
      - 'icons/studio.svg'
      - '.github/workflows/icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar PNG de 192 e 512 pixels sem alterar as molduras
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 192 -h 192 icons/studio.svg -o icons/studio-192.png
          rsvg-convert -w 512 -h 512 icons/studio.svg -o icons/studio-512.png
      - name: Registrar arquivos no mesmo repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/studio-192.png icons/studio-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Gerar ícones PNG do PWA privado"
            git push
          fi
